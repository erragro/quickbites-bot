services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quickbites
      POSTGRES_PASSWORD: quickbites
      POSTGRES_DB: quickbites
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quickbites"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://quickbites:quickbites@postgres:5432/quickbites
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-asia-south1}
      GOOGLE_APPLICATION_CREDENTIALS: /secrets/gcp-key.json
      GEMINI_FAST_MODEL: ${GEMINI_FAST_MODEL:-gemini-2.5-flash-lite}
      GEMINI_SMART_MODEL: ${GEMINI_SMART_MODEL:-gemini-2.5-flash}
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      SARVAM_FAST_MODEL: ${SARVAM_FAST_MODEL:-sarvam-30b}
      SARVAM_SMART_MODEL: ${SARVAM_SMART_MODEL:-sarvam-105b}
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY}
      SIMULATOR_BASE_URL: ${SIMULATOR_BASE_URL}
      CANDIDATE_TOKEN: ${CANDIDATE_TOKEN}
    volumes:
      - ${GOOGLE_APPLICATION_CREDENTIALS_HOST:-/dev/null}:/secrets/gcp-key.json:ro
    ports:
      - "8000:8000"

volumes:
  pgdata:
